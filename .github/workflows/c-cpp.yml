name: C/C++ build

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: compile
      run: gcc hello.c -o hello
    - name: upload output
      uses: actions/upload-artifact@v4
      with:
        name: my‑program
        path: hello
